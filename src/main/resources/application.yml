server:
  port: 80


spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDRESS}/${MYSQL_DATABASE:springboot_demo}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  mvc:
    view:
      suffix: .html
      prefix: /
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml

wechat:
  app-id: ${WECHAT_APPID}
  app-secret: ${WECHAT_APPSECRET}

# 文件上传配置
file:
  upload:
    # 上传目录，支持相对路径和绝对路径
    # 相对路径：基于 user.dir 或 java.io.tmpdir
    # 绝对路径：如 /data/uploads 或 /tmp/uploads
    dir: ${FILE_UPLOAD_DIR:uploads}
    avatar:
      path: avatar
    # 最大文件大小（字节），默认10MB
    max-size: ${FILE_UPLOAD_MAX_SIZE:10485760}
  access:
    # 文件访问基础URL，如果为空则使用 /api/files 接口访问
    # 如果配置了外部文件服务器（如CDN、COS），填写完整的基础URL
    base-url: ${FILE_ACCESS_BASE_URL:}